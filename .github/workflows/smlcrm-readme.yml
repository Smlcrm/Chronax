# Installed by the simulacrum-readme skill. Fails when README.md or
# CITATION.cff is missing a required section, has them out of order, keeps
# placeholder text, or has an invalid citation. Fix with the skill, not by
# editing this file.
name: readme-standard

on:
  pull_request:
  push:
    branches: [main, master, dev, test, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-standard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install citation validators
        run: python -m pip install --disable-pip-version-check --quiet pybtex==0.24.0 cffconvert==2.0.0 pyyaml

      - name: Required sections, order, placeholders
        run: python .github/scripts/smlcrm_readme_lint.py .

      - name: BibTeX compiles and CITATION.cff validates
        run: python .github/scripts/smlcrm_validate_citation.py .

# Generate the Chronax docs and publish them into the aggregated docs repo.
#
# Prod twin of web-docs-dev.yml, but triggered by RELEASES, not pushes:
# a published release generates docs from the exact commit its tag points
# at and publishes them into the prod branch of Smlcrm/web-docs, so
# docs.smlcrm.com documents the code users actually install. All products are served
# from one Cloud Run service at one hostname, where each product is a path
# (docs.smlcrm.com/chronax), so the built site is pushed into the chronax/
# folder of Smlcrm/web-docs and that repo builds and deploys.
#
# Generation stays here: the Vertex ADC federation and the per-project GCS
# cache both belong with the source they document.
name: Web docs (prod)

on:
  release:
    types: [published]
  # Manual escape hatch and the BACKFILL path: name any existing release
  # tag to (re)generate its docs. The workflow definition runs from the
  # branch you dispatch on; the named tag is what gets checked out.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to document, verbatim (e.g. v1.4.2)'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-docs-chronax-prod
  # Never cancel: each run publishes a DIFFERENT version's docs, so a
  # superseded run is still work that must land. The publish step already
  # rebases and retries when runs race on the docs repo.
  cancel-in-progress: false

env:
  PROJECT_SLUG: chronax
  # Where the built site lands. Releases are cut from prod, so the site
  # goes to the web-docs branch production serves from.
  DOCS_REPO: Smlcrm/web-docs
  DOCS_BRANCH: prod
  # Recreated in sml-website-dev, the original died with sml-web-doc-gen-dev
  # on 2026-08-02. The first run after that is a cold build: every module
  # goes through Gemini. Subsequent runs only regenerate what changed.
  # Separate prefix from the dev pipeline: the two branches generate
  # different content and `rsync -d` would clobber the other's cache.
  CACHE_BUCKET: gs://sml-website-dev-docgen-cache/chronax-prod
  # Generation runs against Vertex AI through ADC. There is no API key: org
  # policy forbids long-lived keys, and the job is already federated via WIF.
  VERTEX_PROJECT_ID: sml-website-dev
  # Matches what Terraform sets on the runtime services, so generation and
  # Ask AI both hit the same endpoint.
  VERTEX_LOCATION: global
  BUILDER_IMAGE: us-central1-docker.pkg.dev/sml-artifacts-dev/sml-web-doc-docker/docgen-builder:latest

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      # Release events check out the release tag's commit by default; a
      # dispatch names the tag explicitly ('' falls through to the default).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

      - name: Resolve the version being documented
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            RELEASED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          else
            VERSION="${{ github.event.release.tag_name }}"
            RELEASED="${{ github.event.release.published_at }}"
          fi
          # The tag becomes a directory name and a JSON value, verbatim.
          if ! printf '%s' "${VERSION}" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::version '${VERSION}' is not a safe path segment"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "released=${RELEASED}" >> "$GITHUB_OUTPUT"
          echo "Documenting ${VERSION} (released ${RELEASED})"

      - name: Ensure the docgen config exists (backfilled tags predate it)
        run: |
          set -euo pipefail
          if [ ! -f web-docs/docgen.toml ]; then
            git fetch --depth 1 origin prod
            git checkout origin/prod -- web-docs/
            echo "web-docs/ overlaid from prod (tag predates the docs config)"
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: sml-bootstrap-cicd
          workload_identity_provider: projects/972498125049/locations/global/workloadIdentityPools/github-pool-sml-bootstrap-cicd/providers/github
          service_account: github-ci-sml-bootstrap-cicd@sml-bootstrap-cicd.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        # Only to pull the builder image; nothing is pushed from this repo now.
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Restore the doc cache
        run: |
          mkdir -p .docgen-cache
          gsutil -m rsync -r "${CACHE_BUCKET}" .docgen-cache || true

      - name: Generate the docs
        run: |
          set -euo pipefail
          # ADC has to resolve INSIDE the container, and every path involved is
          # an absolute HOST path: GOOGLE_APPLICATION_CREDENTIALS, and the OIDC
          # token file named inside that credential file. So both directories
          # google-github-actions/auth writes to are mounted at their original
          # paths — the workspace (where the credential file actually lands)
          # and RUNNER_TEMP — and the env var is passed through unchanged.
          #
          # Mounting the workspace only at /work is what broke this: the file
          # was present, under a path the credential chain never looks at, so
          # generation failed with DefaultCredentialsError after ingesting the
          # whole repo. Read-only, and no credential is ever copied.
          docker run --rm \
            -e GOOGLE_APPLICATION_CREDENTIALS \
            -e GOOGLE_CLOUD_PROJECT \
            -e GOOGLE_CLOUD_LOCATION \
            -v "${RUNNER_TEMP}:${RUNNER_TEMP}:ro" \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}:ro" \
            -v "${PWD}:/work" \
            -v "${PWD}/.docgen-cache:/app/.docgen-cache" \
            "${BUILDER_IMAGE}" \
            --repo /work --out /work/site --config /work/web-docs/docgen.toml \
            --version "${{ steps.version.outputs.version }}"
        env:
          GOOGLE_CLOUD_PROJECT: ${{ env.VERTEX_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.VERTEX_LOCATION }}

      - name: Verify the site actually generated
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error::site/index.html missing"; exit 1; }
          COUNT="$(find site -name '*.html' | wc -l)"
          echo "generated ${COUNT} html file(s)"
          [ "${COUNT}" -gt 1 ] || { echo "::error::only ${COUNT} page(s) generated"; exit 1; }

      - name: Save the doc cache
        run: gsutil -m rsync -d -r .docgen-cache "${CACHE_BUCKET}"

      - name: Publish the site into the docs repo
        env:
          DOCS_TOKEN: ${{ secrets.DOCGEN_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASED: ${{ steps.version.outputs.released }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_TOKEN:-}" ]; then
            echo "::error::DOCGEN_TOKEN is not set. It needs contents:write on ${DOCS_REPO}."
            exit 1
          fi

          CLONE="${RUNNER_TEMP}/web-docs"
          git clone --depth 1 --branch "${DOCS_BRANCH}" \
            "https://x-access-token:${DOCS_TOKEN}@github.com/${DOCS_REPO}.git" "${CLONE}"

          # One self-contained site per release, side by side. --delete is
          # scoped INSIDE this version's directory: republishing a version
          # replaces it wholesale, and other versions are never touched.
          rsync -a --delete site/ "${CLONE}/${PROJECT_SLUG}/${VERSION}/"

          # Maintain the manifest the version switcher and serve.py read.
          # Latest is the highest tag numerically, not the newest publish,
          # so backfilling an old release never steals "latest". (Plain
          # vX.Y.Z tags sort exactly; suffixed prereleases sort textually.)
          python3 - "${CLONE}/${PROJECT_SLUG}/versions.json" <<'EOF'
          import json, os, re, sys
          from pathlib import Path

          path = Path(sys.argv[1])
          version = os.environ["VERSION"]
          released = os.environ["RELEASED"]
          data = json.loads(path.read_text()) if path.exists() else {}
          versions = [
              v for v in data.get("versions", [])
              if v.get("version") != version
          ]
          versions.append({"version": version, "released": released})

          def key(entry):
              return [
                  (1, int(p)) if p.isdigit() else (0, p)
                  for p in re.split(r"[.\-]", entry["version"].lstrip("vV"))
              ]

          versions.sort(key=key, reverse=True)
          data["latest"] = versions[0]["version"]
          data["versions"] = versions
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"manifest: {len(versions)} version(s), latest {data['latest']}")
          EOF

          cd "${CLONE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "${PROJECT_SLUG}"
          if git diff --cached --quiet; then
            echo "No documentation changes to publish."
            exit 0
          fi
          git commit -q -m "docs(${PROJECT_SLUG}): ${VERSION} from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          # Both product repos push to the same branch, so a concurrent publish
          # can land first. Rebase and retry rather than failing a good build.
          for i in 1 2 3 4 5; do
            if git push origin "${DOCS_BRANCH}"; then
              echo "Published ${PROJECT_SLUG} docs to ${DOCS_REPO}@${DOCS_BRANCH}"
              exit 0
            fi
            echo "push rejected (attempt ${i}), rebasing onto the latest ${DOCS_BRANCH}"
            git fetch origin "${DOCS_BRANCH}"
            git rebase "origin/${DOCS_BRANCH}"
            sleep $((i * 3))
          done
          echo "::error::could not push to ${DOCS_REPO} after 5 attempts"
          exit 1

experiment:
  h: 24
  input_size: 72
  seeds: [42, 43, 44, 45, 46]   # first `warmup_seeds` per (model,dataset) = warmup for timing
  warmup_seeds: 1               # leading seeds excluded from the after-warmup wall-clock mean
  threads: 1                    # equal CPU thread budget pinned for BOTH libraries

datasets:
  - { name: AirlinePassengers, path: benchmarks/benchmark_datasets/airline-passengers.csv,
      ds_col: Month,    y_col: Passengers,  freq: MS }
  - { name: DailyFemaleBirths, path: benchmarks/benchmark_datasets/daily-total-female-births.csv,
      ds_col: Date,     y_col: Births,      freq: D }
  - { name: RoomTemperature,   path: "benchmarks/benchmark_datasets/room temperature data.csv",
      ds_col: Datetime, y_col: Hourly_Temp, freq: h }

# Models are auto-discovered from chronax.models (any BaseForecaster taking
# h/input_size/random_seed). Both libraries use matching defaults + MAE loss, and
# multivariate models get n_series=1 automatically — so nothing is listed per model.
# Add an optional `overrides:` mapping (model -> chronax_params / nf_params) only to
# change a param for a specific model.

overrides:
  # Chronax DeepNPTS is identity-scaled and defaults batch_norm off (its running
  # stats add state complexity); NF DeepNPTS defaults scaler_type='standard' +
  # batch_norm=True. Pin NF to match so the comparison isolates the engine
  # (JAX vs PyTorch-Lightning), not the preprocessing.
  DeepNPTS:
    nf_params: { scaler_type: identity, batch_norm: false }

experiment:
  h: 24
  input_size: 72
  seeds: [42, 43, 44, 45, 46]   # first `warmup_seeds` per (model,dataset) = warmup for timing
  warmup_seeds: 1               # leading seeds excluded from the after-warmup wall-clock mean
  threads: 1                    # equal CPU thread budget pinned for BOTH libraries

datasets:
  # --- univariate (legacy) ---
  - { name: AirlinePassengers, kind: univariate, path: benchmarks/benchmark_datasets/airline-passengers.csv,
      ds_col: Month,    y_col: Passengers,  freq: MS }
  - { name: DailyFemaleBirths, kind: univariate, path: benchmarks/benchmark_datasets/daily-total-female-births.csv,
      ds_col: Date,     y_col: Births,      freq: D }
  - { name: RoomTemperature, kind: univariate, path: "benchmarks/benchmark_datasets/room temperature data.csv",
      ds_col: Datetime, y_col: Hourly_Temp, freq: h }

  # --- multivariate (TempusBench, non-Kaggle, <=4 features) ---
  - name: GA4EcommerceKPI
    kind: multivariate
    path: benchmarks/benchmark_datasets/ga4-ecommerce-kpi.csv
    ds_col: Datetime
    y_cols: [daily_pageviews, daily_active_users, daily_purchase_events, daily_revenue_usd]
    freq: D
    h: 7
    input_size: 35
  - name: WeeklyCushingUS
    kind: multivariate
    path: benchmarks/benchmark_datasets/weekly-cushing-us.csv
    ds_col: Datetime
    y_cols: [cushing_crude_oil_stocks, refinery_utilization, loaded_tanker_transits_us_gulf_lag4w]
    freq: W-WED
  - name: SplitSmartACEnergy
    kind: multivariate
    path: benchmarks/benchmark_datasets/splitsmart-ac-energy.csv
    ds_col: Datetime
    y_cols: [electrical_current, voltage, power_factor, room_temperature]
    freq: 2min

  # --- covariate (TempusBench, non-Kaggle, <=4 features) ---
  - name: GA4RevenueTraffic
    kind: covariate
    path: benchmarks/benchmark_datasets/ga4-revenue-traffic.csv
    ds_col: Datetime
    y_col: daily_revenue_usd
    hist_exog_cols: [percent_mobile_traffic, percent_paid_traffic]
    freq: D
    h: 7
    input_size: 35
  - name: GEFCom2014PV
    kind: covariate
    path: benchmarks/benchmark_datasets/gefcom2014-pv.csv
    ds_col: Datetime
    y_col: normalized_solar_power_output
    hist_exog_cols: [global_horizontal_irradiance, air_temperature_at_2_meters, total_cloud_cover]
    freq: h
  - name: CapitalBikeshare
    kind: covariate
    path: benchmarks/benchmark_datasets/capital-bikeshare.csv
    ds_col: Datetime
    y_col: bike_trips
    hist_exog_cols: [temp, hum, windspeed]
    freq: D

# Models are auto-discovered from chronax.models (any BaseForecaster taking
# h/input_size/random_seed). MAE loss is forced on both sides; multivariate models
# get n_series=1 automatically. Use `overrides:` when Chronax and NF defaults
# diverge (transformers, DeepNPTS, etc.).

overrides:
  # Chronax DeepNPTS is identity-scaled and defaults batch_norm off (its running
  # stats add state complexity); NF DeepNPTS defaults scaler_type='standard' +
  # batch_norm=True. Pin NF to match so the comparison isolates the engine
  # (JAX vs PyTorch-Lightning), not the preprocessing.
  DeepNPTS:
    nf_params: { scaler_type: identity, batch_norm: false }

  # NF DeepAR with loss=MAE() still runs trajectory_samples=100 MC samples per
  # step to compute MAE — 100× slowdown vs 1 sample. Fix: trajectory_samples=1.
  # windows_batch_size=32 matches Chronax's batch_size=32 default.
  DeepAR:
    nf_params: { trajectory_samples: 1, windows_batch_size: 32 }

  # Autoformer/FEDformer: pin NF to the Chronax port protocol (not NF shipped
  # defaults of max_steps=5000 / windows_batch_size=1024 / identity scaler).
  Autoformer:
    chronax_params:
      max_steps: 1000
      batch_size: 32
      num_lr_decays: 3
      val_fraction: 0.0
      val_check_steps: 100
      early_stop_patience_steps: -1
      grad_clip: 0.0
    nf_params:
      max_steps: 1000
      windows_batch_size: 32
      num_lr_decays: 3
      scaler_type: robust
      val_check_steps: 100
      early_stop_patience_steps: -1

  FEDformer:
    chronax_params:
      max_steps: 1000
      batch_size: 32
      num_lr_decays: 3
      val_fraction: 0.0
      val_check_steps: 100
      early_stop_patience_steps: -1
      grad_clip: 0.0
    nf_params:
      max_steps: 1000
      windows_batch_size: 32
      num_lr_decays: 3
      scaler_type: robust
      val_check_steps: 100
      early_stop_patience_steps: -1

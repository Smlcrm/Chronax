experiment:
  h: 24
  input_size: 72
  seeds: [42, 43, 44, 45, 46]   # first `warmup_seeds` per (model,dataset) = warmup for timing
  warmup_seeds: 1               # leading seeds excluded from the after-warmup wall-clock mean
  threads: 1                    # equal CPU thread budget pinned for BOTH libraries

datasets:
  - { name: AirlinePassengers, path: benchmarks/benchmark_datasets/airline-passengers.csv,
      ds_col: Month,    y_col: Passengers,  freq: MS }
  - { name: DailyFemaleBirths, path: benchmarks/benchmark_datasets/daily-total-female-births.csv,
      ds_col: Date,     y_col: Births,      freq: D }
  - { name: RoomTemperature,   path: "benchmarks/benchmark_datasets/room temperature data.csv",
      ds_col: Datetime, y_col: Hourly_Temp, freq: h }

models:
  - name: GRU
    chronax_params: { max_steps: 1000, learning_rate: 0.001, loss: mae }   # scaler: RobustScaler is hardwired in the Chronax GRU (no knob)
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, loss: MAE }
  - name: PatchTST
    chronax_params: { max_steps: 5000, learning_rate: 0.0001, loss: mae }  # scaler: RevIN is internal (no scaler_type knob)
    nf_params:      { max_steps: 5000, learning_rate: 0.0001, scaler_type: identity, loss: MAE }  # scaler_type=identity is NF's native PatchTST default made explicit (not a protocol change)
  - name: KAN
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler: identity, loss: mae }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: identity, loss: MAE }
  - name: TFT
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, loss: mae }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, loss: MAE }
  - name: iTransformer
    chronax_params: { max_steps: 1000, learning_rate: 0.001, loss: mae }   # natively multivariate; Chronax exposes a univariate adaptation
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: identity, loss: MAE, n_series: 1 }

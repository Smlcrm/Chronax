experiment:
  h: 24
  input_size: 72
  seeds: [42, 43, 44, 45, 46]   # first `warmup_seeds` per (model,dataset) = warmup for timing
  warmup_seeds: 1               # leading seeds excluded from the after-warmup wall-clock mean
  threads: 10                   # = all physical cores. Owner principle
                                # (2026-07-07): harness settings must let each model run at its
                                # best under a fair symmetric budget — measurements should reflect
                                # MODEL performance, not artificial harness constraints. XLA cannot
                                # be capped at N threads on macOS anyway (the pin never bound the
                                # chronax side), so "all cores for both, cells sequential" is the
                                # only genuinely symmetric configuration on this machine.

datasets:
  - { name: AirlinePassengers, path: benchmarks/benchmark_datasets/airline-passengers.csv,
      ds_col: Month,    y_col: Passengers,  freq: MS }
  - { name: DailyFemaleBirths, path: benchmarks/benchmark_datasets/daily-total-female-births.csv,
      ds_col: Date,     y_col: Births,      freq: D }
  - { name: RoomTemperature,   path: "benchmarks/benchmark_datasets/room temperature data.csv",
      ds_col: Datetime, y_col: Hourly_Temp, freq: h }

# Models are auto-discovered from chronax.models (any BaseForecaster taking
# h/input_size/random_seed); both libraries use MAE loss and multivariate models
# get n_series=1 automatically. XLSTM is auto-EXCLUDED (its ctor uses
# ctx_len/horizon_train, not the neural windowed signature) — the deliberate
# paired-run exclusion (owner, 2026-07-06: Chronax XLSTM is xLSTMTime, not
# architecture-1:1 with NF's xLSTM) is now STRUCTURAL, not a config omission.
#
# ⚠ The `overrides:` below are NOT optional cosmetics: dev's auto-discovery falls
# back to each library's OWN class defaults when a model is unlisted, and those do
# NOT match (e.g. NF Informer defaults to 5000 steps + identity scaler). Every
# entry pins a MEASURED §8 deviation ("optimize both libraries to purely reflect
# model performance") — dropping one silently mis-runs that model. Preserved
# verbatim across the 2026-07-20 dev(auto-discovery) merge; per-model rationale in
# the comments.
overrides:
  GRU:
    # Chronax GRU hardwires RobustScaler (no knob); pin NF to robust to match.
    chronax_params: { max_steps: 1000, learning_rate: 0.001 }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust }
  PatchTST:
    # PatchTST needs the longer 5000-step budget; NF scaler_type=identity is its
    # native PatchTST default made explicit (chronax RevIN is internal, no knob).
    chronax_params: { max_steps: 5000, learning_rate: 0.0001 }
    nf_params:      { max_steps: 5000, learning_rate: 0.0001, scaler_type: identity }
  KAN:
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler: identity }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: identity }
  TFT:
    # windows_batch_size=128 deviates from the NF default (1024) SYMMETRICALLY:
    # with-replacement sampling pads every step to 1024 windows even on 25-window
    # datasets (both libraries), ~2 h/seed on CPU. 128 = NF's own RNN-family default.
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 128 }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 128 }
  iTransformer:
    # natively multivariate (n_series=1 auto-added NF-side); NF identity = native default.
    chronax_params: { max_steps: 1000, learning_rate: 0.001 }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: identity }
  Informer:
    # Two SYMMETRIC deviations from NF Informer defaults (5000 steps, identity scaler):
    # steps=1000 (5000 costs hours/seed CPU-side) and scaler_type=robust (identity
    # feeds raw-scale data and structurally underfits at 1000 steps x lr 1e-4 —
    # chronax MAE 427 on airline, 2026-07-06). wbs=128: see TFT.
    chronax_params: { max_steps: 1000, learning_rate: 0.0001, scaler_type: robust, windows_batch_size: 128 }
    nf_params:      { max_steps: 1000, learning_rate: 0.0001, scaler_type: robust, windows_batch_size: 128 }
  TCN:
    # NF TCN defaults already equal the harness conventions; pinned explicitly so the
    # auto-discovery default-fallback can't drift them. wbs=128 = NF's own TCN default.
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 128 }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 128 }
  StemGNN:
    # wbs=32 = NF's OWN StemGNN default; n_series=1 auto-added NF-side. ⚠ At n_series=1
    # StemGNN's forecast is input-independent in scaled space on BOTH sides (proven
    # bit-exact on NF 3.1.7) — the pairing is honest but compares scaler-anchored
    # constant predictors.
    chronax_params: { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 32 }
    nf_params:      { max_steps: 1000, learning_rate: 0.001, scaler_type: robust, windows_batch_size: 32 }
  DeepNPTS:
    # Chronax DeepNPTS is identity-scaled and defaults batch_norm off (its running
    # stats add state complexity); NF DeepNPTS defaults scaler_type='standard' +
    # batch_norm=True. Pin NF to match so the comparison isolates the engine
    # (JAX vs PyTorch-Lightning), not the preprocessing.
    nf_params: { scaler_type: identity, batch_norm: false }

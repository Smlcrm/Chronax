experiment:
  horizon: 24
  seasonality: 24
  confidence_level: 95
  n_iterations: 5
  scales: [100] #, 500, 1000, 5000, 10000, 50000]

# environments:
#   chronax_python: "C:\\Users\\omkar\\anaconda3\\envs\\chronax_env_1\\python.exe" # add the environment path for your local env
#   sf_python: "C:\\Users\\omkar\\anaconda3\\envs\\statsforecast_env\\python.exe" # same as above

datasets:
  # - name: "Trend"
  #   type: "synthetic"
#  - name: "Seasonality"
#    type: "synthetic"
#  - name: "Stochastic"
#    type: "synthetic"
  # Example external datasets (uncomment and update paths to use):
- name: "AirlinePassengers"
  type: "external"
  path: "D:\\SIMULACRUM\\ML\\chronax\\eval_dev\\benchmark_datasets\\airline-passengers.csv"
  # target_column: "Passengers"  # Optional: column name with target values
- name: "daily-total-female-births"
  type: "external"
  path: "D:\\SIMULACRUM\\ML\\chronax\\eval_dev\\benchmark_datasets\\daily-total-female-births.csv"
  # target_column: "demand"
- name: "room-temperature-data"
  type: "external"
  path: "D:\\SIMULACRUM\\ML\\chronax\\eval_dev\\benchmark_datasets\\room temperature data.csv"

models:
  # --- Simple Baselines ---
  - name: "Naive"
    library: "chronax"
    params: {}
  - name: "Naive"
    library: "statsforecast"
    params: {}
  - name: "SeasonalNaive"
    library: "chronax"
    params: { season_length: 24 }
  - name: "SeasonalNaive"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "HistoricAverage"
    library: "chronax"
    params: {}
  - name: "HistoricAverage"
    library: "statsforecast"
    params: {}
  - name: "RandomWalkWithDrift"
    library: "chronax"
    params: {}
  - name: "RandomWalkWithDrift"
    library: "statsforecast"
    params: {}
  - name: "WindowAverage"
    library: "chronax"
    params: { window_size: 24 }
  - name: "WindowAverage"
    library: "statsforecast"
    params: { window_size: 24 }
  - name: "SeasonalWindowAverage"
    library: "chronax"
    params: { window_size: 3, season_length: 24 }
  - name: "SeasonalWindowAverage"
    library: "statsforecast"
    params: { window_size: 3, season_length: 24 }
  # --- Smoothing Models ---
  - name: "SimpleExponentialSmoothing"
    library: "chronax"
    params: { alpha: 0.3 }
  - name: "SimpleExponentialSmoothing"
    library: "statsforecast"
    params: { alpha: 0.3 }
  - name: "SeasonalExponentialSmoothing"
    library: "chronax"
    params: { season_length: 24, alpha: 0.3 }
  - name: "SeasonalExponentialSmoothing"
    library: "statsforecast"
    params: { season_length: 24, alpha: 0.3 }
  - name: "Holt"
    library: "chronax"
    params: { season_length: 24, error_type: 'A' }
  - name: "Holt"
    library: "statsforecast"
    params: { season_length: 24, error_type: 'A' }
  - name: "HoltWinters"
    library: "chronax"
    params: { season_length: 24, error_type: 'A', season_type: 'A' }
  - name: "HoltWinters"
    library: "statsforecast"
    params: { season_length: 24, error_type: 'A', season_type: 'A' }
  # --- Intermittent Demand Models ---
  - name: "ADIDA"
    library: "chronax"
    params: {}
  - name: "ADIDA"
    library: "statsforecast"
    params: {}
  - name: "CrostonClassic"
    library: "chronax"
    params: {}
  - name: "CrostonClassic"
    library: "statsforecast"
    params: {}
  - name: "TSB"
    library: "chronax"
    params: { alpha_d: 0.3, alpha_p: 0.3 }
  - name: "TSB"
    library: "statsforecast"
    params: { alpha_d: 0.3, alpha_p: 0.3 }
  - name: "IMAPA"
    library: "chronax"
    params: {}
  - name: "IMAPA"
    library: "statsforecast"
    params: {}
  # --- Decomposition & Volatility ---
  - name: "MSTL"
    library: "chronax"
    params: { period: 24 }
  - name: "MSTL"
    library: "statsforecast"
    params: { period: 24 }
  - name: "GARCH"
    library: "chronax"
    params: { p: 1, q: 1 }
  - name: "GARCH"
    library: "statsforecast"
    params: { p: 1, q: 1 }
  # --- Auto Models (base + Auto pairs) ---
  - name: "AutoETS"
    library: "chronax"
    params: { season_length: 24 }
  - name: "AutoETS"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "Theta"
    library: "chronax"
    params: { season_length: 24 }
  - name: "Theta"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "AutoTheta"
    library: "chronax"
    params: { season_length: 24 }
  - name: "AutoTheta"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "AutoCES"
    library: "chronax"
    params: { season_length: 24 }
  - name: "AutoCES"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "ARIMA"
    library: "chronax"
    params: { order: [1, 1, 1] }
  - name: "ARIMA"
    library: "statsforecast"
    params: { order: [1, 1, 1] }
  - name: "AutoARIMA"
    library: "chronax"
    params: {}
  - name: "AutoARIMA"
    library: "statsforecast"
    params: {}
  - name: "MFLES"
    library: "chronax"
    params: { season_length: 24 }
  - name: "MFLES"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "AutoMFLES"
    library: "chronax"
    params: { season_length: 24, test_size: 24 }
  - name: "AutoMFLES"
    library: "statsforecast"
    params: { season_length: 24, test_size: 24 }
  - name: "TBATS"
    library: "chronax"
    params: { season_length: 24 }
  - name: "TBATS"
    library: "statsforecast"
    params: { season_length: 24 }
  - name: "AutoTBATS"
    library: "chronax"
    params: { season_length: 24 }
  - name: "AutoTBATS"
    library: "statsforecast"
    params: { season_length: 24 }



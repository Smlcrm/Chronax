[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronax"
version = "0.1.1"
description = "A JAX-based time-series forecasting library."
readme = "README.md"
authors = [
    { name = "Simulacrum, Inc", email = "oss@simulacrum.ai" }
]
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["time-series", "forecasting", "jax", "arima", "ets", "machine-learning"]
dependencies = [
    "jax>=0.4.0",
    "jaxlib>=0.4.0",
    "jaxopt",
    "optax",
    "numpy",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
]


[project.urls]
Homepage = "https://github.com/Smlcrm/Chronax"
Repository = "https://github.com/Smlcrm/Chronax"
Issues = "https://github.com/Smlcrm/Chronax/issues"

[tool.setuptools.packages.find]
include = ["chronax", "chronax.*"]
exclude = ["benchmarks*", "tests*", "eval_dev*", "tutorials*"]

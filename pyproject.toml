[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronax"
version = "0.1.0"
description = "A JAX-based time-series forecasting library."
readme = "README.md"
authors = [
    { name = "Simulacrum, Inc", email = "oss@simulacrum.ai" }
]
license = { text = "MIT License" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.6.0,<0.8",
    "jaxlib>=0.6.0,<0.8",
    "jaxopt>=0.8,<0.9",
    "flax>=0.10,<0.11",
    "optax>=0.2.4,<0.3",
    "numpy",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
]


[project.urls]
Homepage = "https://github.com/Smlcrm/Chronax"
Repository = "https://github.com/Smlcrm/Chronax"
Issues = "https://github.com/Smlcrm/Chronax/issues"

[tool.setuptools.packages.find]
include = ["chronax", "chronax.*"]
exclude = ["benchmarks*", "tests*", "eval_dev*", "tutorials*"]

# Documentation config for docgen (github.com/Smlcrm/web-doc-generator).
# Passed explicitly via --config in web-docs/cloudbuild.yaml.

[project]
name = "Chronax"
description = "A JAX-accelerated time-series forecasting library with a unified fit / predict interface."
package = "chronax"
# instructions = [add repo link to the instructions]

[theme]
preset = "simulacrum"

# Assets referenced by old release tags that have since moved. Tags are
# immutable; docgen rewrites these href/src prefixes at render time.
[render.url_rewrites]
"https://github.com/Smlcrm/assets/" = "https://github.com/Smlcrm/smlcrm-brand-assets/"
